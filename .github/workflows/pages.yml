name: Deploy Playground to Pages

on:
  push:
    branches:
      - main
    # Keep unknown/new application inputs eligible. Agent/CI orchestration and
    # merge policy are not inputs to this deployment or its full benchmark sweep.
    paths:
      - '**'
      - '!.github/workflows/**'
      - '.github/workflows/pages.yml'
      - '!.github/merge-steward/**'
      - '!.github/merge-steward.*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build library for browser
        run: bun build ./src/index.ts --outdir ./playground/dist --target browser --minify

      - name: Bundle TypeScript compiler for offline playground
        run: cp node_modules/typescript/lib/typescript.js ./playground/dist/typescript.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pandas==2.2.3 numpy==2.1.3

      - name: Run benchmarks
        run: bash benchmarks/run_benchmarks.sh

      - name: Copy benchmark results to playground
        run: |
          mkdir -p ./playground/benchmarks
          cp benchmarks/results.json ./playground/benchmarks/results.json

      - name: Validate Python playground examples
        run: python scripts/validate-python-examples.py playground/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground/

  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
